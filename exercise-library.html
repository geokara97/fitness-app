<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f7">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d0f">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="application-name" content="Metron">
    <meta name="apple-mobile-web-app-title" content="Metron">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title data-i18n="lib.title">Metron — Exercise Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="app-nav"></nav>

    <div class="container">
        <a href="exercise.html" class="back-link" data-i18n="ex.back">← Exercise</a>
        <div class="page-head">
            <h1 data-i18n="lib.h1">Exercise Library</h1>
            <p class="muted" data-i18n="lib.subtitle">Add exercises and choose which splits they belong to. When you log a workout, only exercises from the splits you pick are shown.</p>
        </div>

        <!-- Add / edit form -->
        <div class="card" id="lib-form-card">
            <div class="section-title mt-0" id="lib-form-title" data-i18n="lib.addTitle">➕ Add an exercise</div>
            <form id="lib-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="lib-name-en" data-i18n="wo.nxNameEn">Name (English)</label>
                        <input type="text" id="lib-name-en" required maxlength="100" placeholder="e.g. Cable Fly" data-i18n-placeholder="wo.nxNamePh">
                    </div>
                    <div class="form-group">
                        <label for="lib-name-el" data-i18n="wo.nxNameEl">Name (Greek) — optional</label>
                        <input type="text" id="lib-name-el" maxlength="100">
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="wo.nxSplits">Belongs to these splits</label>
                    <div class="slot-checks" id="lib-splits"></div>
                </div>
                <div class="form-group">
                    <label for="lib-measure" data-i18n="wo.nxMeasure">Logged as</label>
                    <select id="lib-measure">
                        <option value="reps" data-i18n="wo.measureReps">Reps (and weight)</option>
                        <option value="time" data-i18n="wo.measureTime">Time — e.g. plank (and weight)</option>
                    </select>
                </div>
                <div class="btn-row">
                    <button type="submit" class="btn btn-primary" id="lib-save" data-i18n="wo.nxSave">Save exercise</button>
                    <button type="button" class="btn btn-ghost" id="lib-cancel" hidden data-i18n="lib.cancelEdit">Cancel</button>
                </div>
            </form>
        </div>

        <!-- List -->
        <div class="section-title" data-i18n="lib.allExercises">📚 All exercises</div>
        <div class="card">
            <div class="foods-toolbar">
                <input type="search" id="lib-search" placeholder="Search exercises…" data-i18n-placeholder="lib.searchPh">
                <select id="lib-filter-split"></select>
            </div>
            <p class="muted text-sm" id="lib-count" style="margin-top:10px"></p>
        </div>
        <div class="card food-group" id="lib-list" style="margin-top:12px"></div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="i18n.js"></script>
    <script src="config.js"></script>
    <script src="motion.js"></script>
    <script src="workout-session.js"></script>
    <script src="exercises-common.js"></script>
    <script src="exercise-library-page.js"></script>
</body>
</html>
